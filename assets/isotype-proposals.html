<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Jota isotype proposals</title>
<style>
  body{margin:0;background:#ECECEC;font-family:"Segoe UI",system-ui,sans-serif;color:#1A0B3B}
  .grid{display:grid;grid-template-columns:repeat(5,220px);gap:20px;padding:30px;width:1160px}
  figure{margin:0}
  .tile{width:220px;height:220px;background:#fff;border-radius:32px;box-shadow:0 18px 36px rgba(26,11,59,.12);display:grid;place-items:center}
  figcaption{margin-top:10px;font-size:15px;font-weight:700;letter-spacing:-.01em;text-align:center}
  figcaption span{font-weight:500;color:#57535C;font-size:12.5px;display:block;margin-top:2px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
  <radialGradient id="sph" cx="30%" cy="26%" r="80%"><stop offset="0" stop-color="#A57AFF"/><stop offset=".38" stop-color="#7F3AF8"/><stop offset="1" stop-color="#5A12D6"/></radialGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6F3AF8"/><stop offset="1" stop-color="#E23AF8"/></linearGradient>
  <filter id="sh" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#6F3AF8" flood-opacity=".3"/></filter>
</defs></svg>
<div class="grid">

<figure><div class="tile"><svg width="180" height="180" viewBox="0 0 200 200">
  <path d="M30 96C26 50 74 24 120 34s64 46 44 84-76 54-110 36C38 146 31 120 30 96Z" fill="#F2ECFF"/>
  <ellipse cx="100" cy="104" rx="76" ry="26" transform="rotate(-24 100 104)" fill="none" stroke="#1A0B3B" stroke-width="9"/>
  <circle cx="100" cy="104" r="36" fill="url(#sph)" filter="url(#sh)"/>
</svg></div><figcaption>01 Orbit<span>sphere + orbit ring</span></figcaption></figure>

<figure><div class="tile"><svg width="180" height="180" viewBox="0 0 200 200">
  <circle cx="100" cy="106" r="66" fill="#F2ECFF"/>
  <circle cx="100" cy="106" r="66" fill="none" stroke="#6F3AF8" stroke-width="7" stroke-linecap="round" stroke-dasharray="0.1 13"/>
  <circle cx="100" cy="40" r="23" fill="url(#sph)" filter="url(#sh)"/>
</svg></div><figcaption>02 Stitch<span>dotted thread ring</span></figcaption></figure>

<figure><div class="tile"><svg width="180" height="180" viewBox="0 0 200 200">
  <circle cx="100" cy="44" r="23" fill="url(#sph)" filter="url(#sh)"/>
  <path d="M52 96 H148" stroke="#1A0B3B" stroke-width="16" stroke-linecap="round"/>
  <path d="M100 100 V138 Q100 168 66 168" fill="none" stroke="#1A0B3B" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
</svg></div><figcaption>03 Person<span>j as an accessible figure</span></figcaption></figure>

<figure><div class="tile"><svg width="180" height="180" viewBox="0 0 200 200">
  <g fill="none" stroke="#6F3AF8" stroke-width="13" stroke-linecap="round">
    <path d="M58 84 A44 44 0 0 1 102 128" opacity=".95"/>
    <path d="M58 56 A72 72 0 0 1 130 128" opacity=".6"/>
    <path d="M58 28 A100 100 0 0 1 158 128" opacity=".3"/>
  </g>
  <circle cx="58" cy="128" r="26" fill="url(#sph)" filter="url(#sh)"/>
</svg></div><figcaption>04 Signal<span>reactivity waves</span></figcaption></figure>

<figure><div class="tile"><svg width="180" height="180" viewBox="0 0 200 200">
  <path d="M100 16 L166 42 V102 C166 142 136 168 100 184 C64 168 34 142 34 102 V42 Z" fill="#1A0B3B"/>
  <circle cx="100" cy="98" r="52" fill="none" stroke="#6F3AF8" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.1 11"/>
  <circle cx="100" cy="98" r="30" fill="url(#sph)"/>
</svg></div><figcaption>05 Guard<span>shield around the sphere</span></figcaption></figure>

<figure><div class="tile"><svg width="180" height="180" viewBox="0 0 200 200">
  <rect x="24" y="24" width="152" height="152" rx="50" fill="url(#bg)"/>
  <path d="M112 78 V122 Q112 150 84 150" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="112" cy="50" r="17" fill="#fff"/>
</svg></div><figcaption>06 Squircle<span>white j on gradient</span></figcaption></figure>

<figure><div class="tile"><svg width="180" height="180" viewBox="0 0 200 200">
  <circle cx="88" cy="112" r="44" fill="none" stroke="#1A0B3B" stroke-width="26"/>
  <circle cx="142" cy="56" r="25" fill="url(#sph)" filter="url(#sh)"/>
</svg></div><figcaption>07 Ring<span>o + the j dot</span></figcaption></figure>

<figure><div class="tile"><svg width="180" height="180" viewBox="0 0 200 200">
  <path d="M42 70C38 40 70 22 100 28s52 30 40 56-44 36-66 28C56 106 43 90 42 70Z" fill="#F2ECFF"/>
  <path d="M110 66 V128 Q110 164 66 156" fill="none" stroke="#6F3AF8" stroke-width="9" stroke-linecap="round" stroke-dasharray="0.1 15"/>
  <circle cx="110" cy="46" r="24" fill="url(#sph)" filter="url(#sh)"/>
</svg></div><figcaption>08 Thread j<span>a j sewn with dots</span></figcaption></figure>

<figure><div class="tile"><svg width="180" height="180" viewBox="0 0 200 200">
  <g fill="none" stroke="#1A0B3B" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M62 62 L24 100 L62 138"/><path d="M138 62 L176 100 L138 138"/>
  </g>
  <circle cx="100" cy="100" r="25" fill="url(#sph)" filter="url(#sh)"/>
</svg></div><figcaption>09 Brackets<span>code around the sphere</span></figcaption></figure>

<figure><div class="tile"><svg width="180" height="180" viewBox="0 0 200 200">
  <rect x="26" y="52" width="124" height="124" rx="44" fill="#1A0B3B"/>
  <circle cx="142" cy="62" r="40" fill="url(#sph)" filter="url(#sh)"/>
  <circle cx="128" cy="48" r="9" fill="#fff" opacity=".35"/>
</svg></div><figcaption>10 Breakout<span>sphere breaks the frame</span></figcaption></figure>

</div></body></html>
