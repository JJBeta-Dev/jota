name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r build
      - name: Link built binaries (pnpm creates the bin shims only once their files exist)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Comments are JSDoc only
        run: node scripts/check-comments.mjs
      - name: Test
        run: pnpm -r test
      - name: Jota Guard on the examples and the docs site
        run: |
          pnpm --filter hello-jota guard --format github
          pnpm --filter blog-jota guard --format github
          pnpm --filter landing-jota guard --format github
          pnpm --filter dashboard-jota guard --format github
          pnpm --filter jota-site guard --format github
