name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options: [jota-js, jota-guard, vite-plugin-jota, create-jota-js, docs site]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest code that shows the problem
      render: tsx
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Node version, operating system, browser
